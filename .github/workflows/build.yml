name: build gameOS image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow default is read-only. Only the release job
# elevates to contents:write, and only on a tag.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read

    steps:
      - name: Checkout gameOS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make patch gzip bzip2 tar xz-utils \
            unzip rsync bc cpio file wget curl git python3 python3-setuptools \
            libncurses-dev libssl-dev swig flex bison ccache shellcheck

      # Fail fast on shell syntax / POSIX regressions BEFORE the ~hour-long
      # build. Every shipped script must parse under a strict POSIX sh (dash
      # on the runner stands in for the target BusyBox ash).
      - name: Lint shell scripts (sh -n, mandatory)
        run: |
          set -eu
          fail=0
          scripts=$(find buildroot/board/gameos/rgds-plus \
            -type f \( -name 'post-*.sh' -o -name 'S*' -o -name 'gameos-*' \
                       -o -name '*.sh' \) | sort)
          for f in $scripts; do
            # Only lint files that look like shell (shebang or known dirs).
            case "$f" in
              */init.d/S*|*/usr/bin/gameos-*|*.sh|*/sleep.d/*|*/wpa_action.sh)
                if head -n1 "$f" | grep -q '^#!.*sh'; then
                  if sh -n "$f"; then
                    echo "ok   $f"
                  else
                    echo "FAIL $f"; fail=1
                  fi
                fi ;;
            esac
          done
          [ "$fail" = 0 ] || { echo "shell syntax errors found"; exit 1; }

      - name: Shellcheck (advisory)
        run: |
          scripts=$(find buildroot/board/gameos/rgds-plus \
            -type f \( -name 'post-*.sh' -o -name 'S*' -o -name 'gameos-*' \
                       -o -name '*.sh' \) | sort)
          for f in $scripts; do
            head -n1 "$f" | grep -q '^#!.*sh' || continue
            shellcheck -s sh -S warning "$f" || true
          done

      # Runnable fault-injection suite (OTA integrity, firstboot data safety,
      # boot-state confirm). These execute on the host with stubbed block/mount
      # I/O -- no hardware needed. A failure here blocks the build.
      - name: Run shell test suite
        run: |
          set -eu
          for t in tests/shell/test-*.sh; do
            echo "==> $t"
            sh "$t"
          done

      - name: Cache Buildroot downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dl
          key: buildroot-dl-${{ hashFiles('buildroot/configs/gameos_rgds_plus_defconfig', 'scripts/fetch-vendor.sh') }}
          restore-keys: buildroot-dl-

      - name: Cache ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Fetch pinned vendor files (kernel patches, DTS, DDR/BL31, fonts)
        run: ./scripts/fetch-vendor.sh

      - name: Clone Buildroot 2026.08
        run: git clone --depth 1 --branch 2026.08 https://github.com/buildroot/buildroot.git buildroot-src

      - name: Configure
        run: |
          make -C buildroot-src O="$GITHUB_WORKSPACE/output" \
            BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot" \
            BR2_DL_DIR="$GITHUB_WORKSPACE/dl" \
            gameos_rgds_plus_defconfig
          echo 'BR2_CCACHE=y' >> output/.config
          make -C buildroot-src O="$GITHUB_WORKSPACE/output" \
            BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot" olddefconfig

      - name: Build (this takes a while)
        run: |
          make -C buildroot-src O="$GITHUB_WORKSPACE/output" \
            BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot" \
            BR2_DL_DIR="$GITHUB_WORKSPACE/dl" \
            -j"$(nproc)"

      # Save caches EVEN WHEN THE BUILD FAILS: the implicit post-step of
      # actions/cache is skipped on failure, which made runs 2-6 rebuild
      # the whole LLVM toolchain from scratch every time (~1h42m each).
      - name: Save Buildroot downloads (always)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dl
          key: buildroot-dl-${{ hashFiles('buildroot/configs/gameos_rgds_plus_defconfig', 'scripts/fetch-vendor.sh') }}-${{ github.run_id }}

      - name: Save ccache (always)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ github.sha }}-${{ github.run_id }}

      - name: Show image info (both models)
        run: |
          ls -lh output/images/gameOS-rgds-plus.img.gz output/images/gameOS-rgds.img.gz
          cat output/images/gameOS-rgds-plus.img.gz.sha256
          cat output/images/gameOS-rgds.img.gz.sha256
          cat output/images/manifest.json

      # Verify the artifacts BEFORE uploading: both model images present, each
      # .sha256 matches its image, manifest version equals the board version,
      # and all seven release assets exist. A broken build never reaches a release.
      - name: Verify artifacts
        run: |
          set -eu
          cd output/images
          for m in rgds-plus rgds; do
            test -f "gameOS-$m.img.gz"
            test -f "gameOS-$m.img.gz.sha256"
            sha256sum -c "gameOS-$m.img.gz.sha256"
          done
          for f in gameOS-rootfs.ext4.gz gameOS-boot.tar.gz manifest.json; do
            test -f "$f"
          done
          want=$(head -n1 "$GITHUB_WORKSPACE/buildroot/board/gameos/rgds-plus/version")
          got=$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' manifest.json | head -n1)
          case "$got" in
            "$want"|"$want"+g*) echo "manifest version $got matches board $want" ;;
            *) echo "version mismatch: manifest=$got board=$want"; exit 1 ;;
          esac
          echo "artifact verification OK"

      - name: Upload image artifact (both models + OTA)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gameOS-image
          path: |
            output/images/gameOS-rgds-plus.img.gz
            output/images/gameOS-rgds-plus.img.gz.sha256
            output/images/gameOS-rgds.img.gz
            output/images/gameOS-rgds.img.gz.sha256
            output/images/manifest.json
            output/images/gameOS-rootfs.ext4.gz
            output/images/gameOS-boot.tar.gz
          compression-level: 0

  # Release is a separate job so the write token is scoped to it alone, and it
  # only runs on a tag after a successful, verified build.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout gameOS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gameOS-image
          path: dist

      - name: Verify downloaded assets
        run: |
          set -eu
          cd dist
          for m in rgds-plus rgds; do
            sha256sum -c "gameOS-$m.img.gz.sha256"
          done
          n=$(ls -1 gameOS-rgds-plus.img.gz gameOS-rgds-plus.img.gz.sha256 \
                   gameOS-rgds.img.gz gameOS-rgds.img.gz.sha256 \
                   manifest.json gameOS-rootfs.ext4.gz gameOS-boot.tar.gz \
                   2>/dev/null | wc -l)
          [ "$n" = 7 ] || { echo "expected 7 assets, got $n"; exit 1; }
          echo "release asset verification OK"

      # A release published by hand from a verified local build must not be
      # replaced by the cloud build of the same tag (different bytes, and the
      # hand-written flashing/backup notes would be lost). Only publish when
      # the release does not have assets yet.
      - name: Check release assets
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Publish release (tags only, when still empty)
        if: steps.rel.outputs.count == '0'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/gameOS-rgds-plus.img.gz
            dist/gameOS-rgds-plus.img.gz.sha256
            dist/gameOS-rgds.img.gz
            dist/gameOS-rgds.img.gz.sha256
            dist/manifest.json
            dist/gameOS-rootfs.ext4.gz
            dist/gameOS-boot.tar.gz
          body: |
            gameOS 镜像（Anbernic RG DS Plus / RG DS，双机型）。

            刷写方法见仓库 docs/FLASHING.md：
            - RG DS Plus 用 gameOS-rgds-plus.img.gz
            - RG DS 用 gameOS-rgds.img.gz
            用 balenaEtcher 将对应镜像直接刷入 microSD 卡即可。
            刷写前请备份卡内数据（见 docs/FLASHING.md）。

            已在运行 gameOS 的设备可在「设置 > 系统更新」里直接检查并安装本版本
            （OTA 仅写入空闲槽，校验通过后才切换启动状态，失败自动回滚）。

            ---

            gameOS images (Anbernic RG DS Plus / RG DS, both models).

            Flashing: see docs/FLASHING.md.
            - RG DS Plus: gameOS-rgds-plus.img.gz
            - RG DS: gameOS-rgds.img.gz
            Write the matching image to a microSD card with balenaEtcher.
            Back up the card first (see docs/FLASHING.md).

            Devices already running gameOS can update via Settings > System update.
            The OTA writes only the idle slot and switches boot state last, after
            every asset is verified; a failed boot rolls back automatically.