name: build gameOS image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout gameOS
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make patch gzip bzip2 tar xz-utils \
            unzip rsync bc cpio file wget curl git python3 python3-setuptools \
            libncurses-dev libssl-dev swig

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: buildroot-dl-${{ hashFiles('buildroot/configs/gameos_rgds_plus_defconfig', 'scripts/fetch-vendor.sh') }}
          restore-keys: buildroot-dl-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Fetch pinned vendor files (kernel patches, DTS, DDR/BL31, fonts)
        run: ./scripts/fetch-vendor.sh

      - name: Clone Buildroot 2026.08
        run: git clone --depth 1 --branch 2026.08 https://github.com/buildroot/buildroot.git buildroot-src

      - name: Configure
        run: |
          make -C buildroot-src O="$GITHUB_WORKSPACE/output" \
            BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot" \
            BR2_DL_DIR="$GITHUB_WORKSPACE/dl" \
            gameos_rgds_plus_defconfig
          echo 'BR2_CCACHE=y' >> output/.config
          make -C buildroot-src O="$GITHUB_WORKSPACE/output" \
            BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot" olddefconfig

      - name: Build (this takes a while)
        run: |
          make -C buildroot-src O="$GITHUB_WORKSPACE/output" \
            BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot" \
            BR2_DL_DIR="$GITHUB_WORKSPACE/dl" \
            -j"$(nproc)"

      - name: Show image info
        run: |
          ls -lh output/images/gameOS-rgds-plus.img.gz
          cat output/images/gameOS-rgds-plus.img.gz.sha256

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameOS-rgds-plus-image
          path: |
            output/images/gameOS-rgds-plus.img.gz
            output/images/gameOS-rgds-plus.img.gz.sha256
          compression-level: 0

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/images/gameOS-rgds-plus.img.gz
            output/images/gameOS-rgds-plus.img.gz.sha256
          body: |
            gameOS 镜像（Anbernic RG DS Plus）。
            刷写方法见仓库 docs/FLASHING.md：用 balenaEtcher 将
            gameOS-rgds-plus.img.gz 直接刷入 microSD 卡即可。