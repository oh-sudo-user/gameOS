# gameOS performance policy preferences.
# Only governor NAMES are defined here — never fixed CPU/GPU MHz. gameos-perf
# reads each policy's scaling_available_governors and writes only a governor the
# kernel actually offers, falling back safely and logging when one is missing.
#
# CPU: UI and light games (GBA/GBC) prefer schedutil for lower idle power;
# heavy games (NDS/PS1/PSP) keep the performance tier the device shipped with.
# GPU: KEEP = leave the driver default untouched. A specific GPU governor is
# enabled only after it is proven available, stable and beneficial on real
# hardware (see the audit doc §7.2); CPU governor names are never applied to GPU.
UI_CPU_GOVERNOR=schedutil
LIGHT_CPU_GOVERNOR=schedutil
HEAVY_CPU_GOVERNOR=performance

UI_GPU_GOVERNOR=KEEP
LIGHT_GPU_GOVERNOR=KEEP
HEAVY_GPU_GOVERNOR=KEEP