# gameOS performance policy preferences.
# Only governor NAMES are defined here — never fixed CPU/GPU MHz. gameos-perf
# reads each policy's scaling_available_governors and writes only a governor the
# kernel actually offers, falling back safely and logging when one is missing.
#
# Strategy names: ui, powersave, balanced, performance, superdrastic.
# light/heavy remain accepted aliases for balanced/performance. superdrastic
# currently maps to the same governor as performance because no frequency floor
# has been measured; no min/max frequency is ever written.
#
# CPU: UI and light games prefer schedutil for lower idle power; heavy games
# (NDS/PS1/PSP) keep the performance tier the device shipped with. powersave is
# used only by the guard or an explicit per-game choice.
# GPU: KEEP = leave the driver default untouched. A specific GPU governor is
# enabled only after it is proven available, stable and beneficial on real
# hardware (see the audit doc §7.2); CPU governor names are never applied to GPU.
UI_CPU_GOVERNOR=schedutil
POWERSAVE_CPU_GOVERNOR=powersave
LIGHT_CPU_GOVERNOR=schedutil
HEAVY_CPU_GOVERNOR=performance
SUPERDRASTIC_CPU_GOVERNOR=performance

UI_GPU_GOVERNOR=KEEP
POWERSAVE_GPU_GOVERNOR=KEEP
LIGHT_GPU_GOVERNOR=KEEP
HEAVY_GPU_GOVERNOR=KEEP
SUPERDRASTIC_GPU_GOVERNOR=KEEP

# Thermal/battery guard. Temperatures are millidegrees as reported by
# /sys/class/thermal/thermal_zone*/temp. A hot or low-battery state clamps a
# top-tier strategy to balanced; a critical state clamps everything to
# powersave. Release only after crossing the cool/recover hysteresis values.
# These are policy thresholds, not hardware limits: the kernel thermal
# framework keeps ownership of throttling. Set GUARD_ENABLE=0 to roll back.
GUARD_ENABLE=1
THERMAL_HOT_MC=85000
THERMAL_CRIT_MC=95000
THERMAL_COOL_MC=80000
BATTERY_LOW_PCT=15
BATTERY_CRIT_PCT=8
BATTERY_RECOVER_PCT=20
