# gameOS RetroArch global configuration
# Appliance mode: KMS/DRM + GLES, udev input, ALSA audio, ozone menu.

video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_vsync = "true"
video_scale_integer = "true"
video_smooth = "false"
video_threaded = "false"
video_gpu_screenshot = "true"
video_font_path = "/usr/share/gameos/fonts/NotoSansSC-Regular.otf"

audio_driver = "alsa"
audio_latency = "64"
audio_resampler = "sinc"
audio_resampler_quality = "1"

input_driver = "udev"
input_autodetect_enable = "true"
input_max_users = "1"
joypad_autoconfig_dir = "/usr/share/retroarch/autoconfig/udev"

# Hotkeys: SELECT is the hotkey enabler (udev_joypad indices, BTN_BACK=0 shift).
#   SELECT + START = quit game (back to gameOS)
#   SELECT + MENU  = RetroArch quick menu
#   SELECT + L/R   = save / load state
input_enable_hotkey_btn = "9"
input_exit_emulator_btn = "10"
input_menu_toggle_btn = "11"
input_save_state_btn = "5"
input_load_state_btn = "6"

# rgui is built-in and needs no external asset pack. The RetroArch source
# tarball ships no media/assets, so ozone would render a blank quick menu.
# ozone + its asset pack is a visual follow-up; the gameOS front-end is the
# primary (Chinese) UI and is unaffected by this in-emulator menu choice.
menu_driver = "rgui"
menu_swap_ok_cancel_buttons = "false"
assets_directory = "/usr/share/retroarch/assets"
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/retroarch/info"

system_directory = "/userdata/bios"
savefile_directory = "/userdata/saves"
savestate_directory = "/userdata/saves"
screenshot_directory = "/userdata/screenshots"

config_save_on_exit = "false"
game_specific_options = "true"
auto_overrides_enable = "false"
auto_remaps_enable = "false"
savestate_auto_save = "false"
savestate_auto_load = "false"
fps_show = "false"