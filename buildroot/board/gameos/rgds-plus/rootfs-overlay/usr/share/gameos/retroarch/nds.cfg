# gameOS — Nintendo DS (melonDS)
# Dual-screen: GAMEOS_DUALSCREEN=1 makes RetroArch span a 1024x1536
# framebuffer across both panels. Top/Bottom layout = 256x384 core
# geometry -> exact 4x integer scale, one NDS screen per panel.
melonds_screen_layout = "Top/Bottom"
melonds_screen_gap = "0"
melonds_touch_mode = "Touch"
melonds_boot_directly = "enabled"
melonds_console_mode = "DS"
# The core is built without GL (its shaders are desktop-GLSL only), so
# rendering uses the software renderer on a worker thread, next to the
# aarch64 JIT CPU thread.
melonds_threaded_renderer = "enabled"
melonds_jit_enable = "enabled"
video_scale_integer = "true"
video_smooth = "false"