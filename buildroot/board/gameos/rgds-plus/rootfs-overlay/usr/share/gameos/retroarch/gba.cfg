# gameOS — Game Boy Advance (mGBA), game gba subsystem tuning.
# Idle-loop removal frees CPU headroom; frameskip 0 keeps every frame
# (GBA is light enough on this chip that smoothness wins).
video_scale_integer = "true"
video_smooth = "false"
mgba_sgb_borders = "OFF"
mgba_force_gbp = "OFF"
mgba_idle_optimization = "Remove Known"
mgba_frameskip = "0"