# gameOS SD card image layout for RG DS Plus (RK3568), A/B system
#
# Raw bootloader areas (written by post-image.sh, outside any GPT entry):
#   sector 64     (0x8000)   idbloader.img  = DDR init blob + U-Boot SPL
#   sector 16384  (0x800000) u-boot.itb     = U-Boot proper + ATF BL31
# These offsets are what RK3568 BootROM expects (SPL at 32 KiB,
# U-Boot proper at 8 MiB — CONFIG_SYS_MMCSD_RAW_MODE_U_BOOT_SECTOR=0x4000).
#
# GPT partitions (section title == GPT partition name):
#   p1 GAMEOS-BOOT    FAT32  256 MiB @ 16 MiB   (boot.scr, /a and /b kernels, state)
#   p2 GAMEOS-ROOT-A  ext4   1200 MiB           (system slot A, shipped image)
#   p3 GAMEOS-ROOT-B  ext4   1200 MiB           (slot B: empty until an OTA fills it)
#   p4 GAMEOS-DATA    exFAT  rest of card       (created on first boot by S20gameos)
#
# boot.scr (built from boot.cmd) picks A or B and rolls back after repeated
# unconfirmed boots. The distro extlinux.conf is only a fallback and boots A.
# rootfs_b.ext4 is a zero-filled file: writing 1.2 GiB of zeros keeps the
# compressed download small and leaves slot B ready for the first update.

image sdcard.img {
  hdimage {
    partition-table-type = "gpt"
  }

  partition GAMEOS-BOOT {
    image = "boot.vfat"
    partition-type-uuid = "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7"
    bootable = true
    offset = 16M
  }

  partition GAMEOS-ROOT-A {
    image = "rootfs.ext4"
    partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
  }

  partition GAMEOS-ROOT-B {
    image = "rootfs_b.ext4"
    partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
  }
}
