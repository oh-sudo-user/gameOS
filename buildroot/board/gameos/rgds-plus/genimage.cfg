# gameOS SD card image layout for RG DS Plus (RK3568)
#
# Raw bootloader areas (written by post-image.sh, outside any GPT entry):
#   sector 64     (0x8000)   idbloader.img  = DDR init blob + U-Boot SPL
#   sector 16384  (0x800000) u-boot.itb     = U-Boot proper + ATF BL31
# These offsets are what RK3568 BootROM expects (SPL at 32 KiB,
# U-Boot proper at 8 MiB — CONFIG_SYS_MMCSD_RAW_MODE_U_BOOT_SECTOR=0x4000).
#
# GPT partitions (section title == GPT partition name, used by
# root=PARTLABEL=GAMEOS-ROOT on the kernel command line):
#   p1 GAMEOS-BOOT  FAT32  256 MiB @ 16 MiB   (Image, DTBs, extlinux.conf)
#   p2 GAMEOS-ROOT  ext4   1200 MiB           (system)
#   p3 GAMEOS-DATA  exFAT  rest of card       (created on first boot)
#
# boot.vfat is assembled by post-image.sh (mkfs.vfat + mcopy) before genimage
# runs, so it is referenced here as a raw prebuilt image.

image sdcard.img {
  hdimage {
    partition-table-type = "gpt"
  }

  partition GAMEOS-BOOT {
    image = "boot.vfat"
    partition-type-uuid = "ebd0a0a2-b9e5-4433-87c0-68b6b72699c7"
    bootable = true
    offset = 16M
  }

  partition GAMEOS-ROOT {
    image = "rootfs.ext4"
    partition-type-uuid = "0fc63daf-8483-4772-8e79-3d69d8477de4"
  }
}